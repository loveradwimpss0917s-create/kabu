name: 仮説検証 ファクター一括（研究用・手動実行）

# Step3-(4): 無料OHLCVデータで検証可能なクロスセクショナル・ファクター4種を一括検証する。
# 信用需給データは無料では取得できない（J-Quants APIの有料プランが必要）ため、
# 既存キャッシュだけで検証できる仮説に切り替えたもの。
#
# 検証するファクターと期待符号はスクリプト内に事前登録してあり、
# 実行後に書き換えてはならない（結果を見てから仮説を変える行為の防止）。
on:
  workflow_dispatch:
    inputs:
      bootstrap_iters:
        description: 'ブートストラップ試行回数'
        required: false
        default: '2000'
      ci_inflation:
        description: '信頼区間の拡大倍率（合成データでの較正値=1.5。通常は変更しない）'
        required: false
        default: '1.5'

permissions:
  contents: write

jobs:
  factors:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ファクター一括検証実行
        env:
          BT_BOOTSTRAP_ITERS: ${{ inputs.bootstrap_iters }}
          BT_CI_INFLATION: ${{ inputs.ci_inflation }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: node backtest/hypothesis-factors.mjs

      - name: 結果をリポジトリにコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/results/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします"
          else
            git commit -m "chore: ファクター一括検証結果を更新 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
