name = "kabu"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[triggers]
# 日次スキャナー（毎日23:00/23:10 UTC = 8:00/8:10 JST）を前半40銘柄・後半41銘柄に分割実行。
# 1本のcronで81銘柄全てを走査するとサブリクエスト上限(50)を超え毎回失敗するため。
# 23:20/23:25 UTCはアウトオブサンプル追跡（20営業日以上前のシグナルの実結果を記録）。
# 同じ理由で2本に分割している
crons = ["0 23 * * *", "10 23 * * *", "20 23 * * *", "25 23 * * *"]

